services:
  askdune:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: askdune

    # Load secrets and application configuration from the host.
    # This file is not copied into the image.
    env_file:
      - .env

    environment:
      HOST: "0.0.0.0"
      PORT: "8000"

      # Validated unified retrieval index
      PROD_DB_PATH: "/data/chroma"

      # Persist downloaded embedding/reranking models.
      HF_HOME: "/cache/huggingface"
      TORCH_HOME: "/cache/torch"
      XDG_CACHE_HOME: "/cache"

    # Keep the pilot endpoint private on the VM.
    # Fermilab's HTTPS reverse proxy can connect to this later.
    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # Validated unified index, mounted read-only for serving
      - "${HOST_DB_PATH}:/data/chroma:ro"

      # Do not download the Hugging Face models on every restart.
      - askdune_model_cache:/cache

    # Helpful on the current rootless Podman/SELinux host when mounting
    # directories from /exp. Revisit this for an eventual OKD deployment.
    security_opt:
      - label=disable

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://127.0.0.1:8000/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  askdune_model_cache:
