<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/styles.css">
    <title>AskDUNE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            max-width: 800px;
            margin: 0 0 20px 0;
            padding: 0 15px;
        }

        .header-section {
            max-width: 800px;
            margin: 0 0 30px 0;
            padding: 0 15px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            resize: none;
            overflow: hidden;
            min-height: 50px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            margin-top: 10px;
        }

        #answer {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 100px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            margin: 5px 0;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #f1f0f0;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .sources-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dcdcdc;
            padding-left: 20px;
        }

        .sources-list li {
            margin-bottom: 5px;
            word-break: break-all;
        }

        form {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            position: sticky;
            background: white;
            border-top: 1px solid #eee;
            box-sizing: border-box;
        }

        /* Spinner */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 15px;
        }

        .spinner-icon {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            font-size: 14px;
            color: #5f6368;
        }

        a {
            color: #0645AD;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #555;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-top: 10px;
        }

        #dune-logo {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: auto;
            z-index: 9999;
            max-width: calc(100vw - 40px);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Tablet and smaller */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            h1 {
                padding: 0 10px;
            }

            form {
                padding: 0 10px;
            }

            #answer {
                padding: 15px 10px;
            }

            #dune-logo {
                width: 120px;
                top: 10px;
                right: 10px;
            }
        }

        /* Mobile phones */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            textarea {
                font-size: 14px;
            }

            button {
                font-size: 14px;
                padding: 6px 12px;
            }

            #dune-logo {
                width: 100px;
            }
        }
    </style>
</head>

<body>
    <h1>AskDUNE</h1>

    {% if auth_enabled %}
    <div style="margin-bottom: 20px; padding: 10px; background-color: #f0f8ff; border-radius: 5px;">
        {% if user %}
        <p>✅ <strong>Authenticated as:</strong> {{ user.email }}</p>
        <a href="/logout" style="color: #dc3545; text-decoration: none;">🚪 Logout</a>
        {% else %}
        <p>🔐 <strong>Authentication Required</strong></p>
        <a href="/login" style="color: #007bff; text-decoration: none;">🔑 Login with Fermilab</a>
        {% endif %}
    </div>
    {% endif %}

    {% if not auth_enabled or user %}
    <div id="answer">
    </div>

    <form>
        <textarea id='input' placeholder="Ask a question:" cols="50"></textarea>
        <button type="submit">Send</button>
    </form>

    <pre id="body"></pre>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const body = document.getElementById('answer');
        const submit_btn = document.querySelector('button');
        const input = document.getElementById('input');
        const sourcesRow = document.getElementById('sources-row');

        input.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        submit_btn.addEventListener("click", async (e) => {
            e.preventDefault();
            const userPrompt = input.value.trim();
            if (!userPrompt) {
                return;
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = userPrompt;
            body.appendChild(userDiv);

            input.value = '';
            input.style.height = 'auto';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-message';
            aiDiv.innerHTML = `<div class="spinner-text">Thinking...</div>`;
            body.appendChild(aiDiv);

            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            const formData = new FormData();
            formData.append('question', userPrompt);

            const response = await fetch("/ui", {
                method: "POST",
                body: formData
            });

            const reader = response.body.getReader();
            let output = "";

            while (true) {
                const { done, value } = await reader.read();
                const chunk = new TextDecoder().decode(value);

                if (chunk.includes('STATUS:')) {
                    continue;
                }

                output += chunk;

                if (output.includes('SOURCES: ')) {
                    const [answerText, sourcesJson] = output.split('SOURCES: ');
                    aiDiv.innerHTML = marked.parse(answerText);

                    try {
                        const sources = JSON.parse(sourcesJson);
                        if (sources && sources.length > 0) {
                            const sourcesContainer = document.createElement('ul');
                            sourcesContainer.className = 'sources-list';

                            sources.forEach(source => {
                                addSourceToBubble(source, sourcesContainer);
                            });

                            aiDiv.appendChild(sourcesContainer);
                        }
                    } catch (e) {
                        console.error("Error parsing sources:", e);
                    }

                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                    break;
                } else {
                    aiDiv.innerHTML = marked.parse(output);
                }

                window.scrollTo(0, document.body.scrollHeight);

                if (done) {
                    break;
                }
            }
        });

        function addSourceToBubble(source, container) {
            try {
                const url = source.url || source;

                const listItem = document.createElement('li');
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.textContent = url;

                listItem.appendChild(link);
                container.appendChild(listItem);
            } catch (e) {
                console.error('Error adding source:', e);
            }
        }
    </script>
    {% endif %}

    <img src="static/images/DUNElogo_color.png" alt="DUNE Logo" id="dune-logo">
</body>

</html>
